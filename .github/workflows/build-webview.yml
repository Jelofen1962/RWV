name: Build with RWV

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Application name'
        required: true
        type: string
        default: 'My Web App'
      app_version:
        description: 'Version (1 to 4 numeric components)'
        required: true
        type: string
        default: '1.0.0'
      icon_source:
        description: 'PNG URL or PNG path in this repository'
        required: true
        type: string
      website_url:
        description: 'Website URL (HTTP, HTTPS, or file:/// URL)'
        required: true
        type: string
      trust_http_origin:
        description: 'Opt in to secure-context treatment for the configured HTTP origin (development only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Prepare Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile customized application
        id: compile
        shell: pwsh
        env:
          INPUT_APP_NAME: ${{ inputs.app_name }}
          INPUT_APP_VERSION: ${{ inputs.app_version }}
          INPUT_ICON_SOURCE: ${{ inputs.icon_source }}
          INPUT_WEBSITE_URL: ${{ inputs.website_url }}
          INPUT_TRUST_HTTP: ${{ inputs.trust_http_origin }}
        run: |
          $trust = $env:INPUT_TRUST_HTTP -eq 'true'
          ./build.ps1 -NonInteractive -RunTests `
            -AppName $env:INPUT_APP_NAME `
            -AppVersion $env:INPUT_APP_VERSION `
            -IconSource $env:INPUT_ICON_SOURCE `
            -WebsiteUrl $env:INPUT_WEBSITE_URL `
            -TrustHttpOrigin:$trust `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'webview-output')
      - name: Verify executable metadata
        shell: pwsh
        env:
          BUILT_EXE: ${{ steps.compile.outputs.exe }}
          EXPECTED_NAME: ${{ inputs.app_name }}
          EXPECTED_VERSION: ${{ inputs.app_version }}
        run: |
          $file = Get-Item -LiteralPath $env:BUILT_EXE
          if ($file.VersionInfo.ProductName -ne $env:EXPECTED_NAME.Trim()) { throw 'Product name mismatch' }
          if ($file.VersionInfo.ProductVersion -ne $env:EXPECTED_VERSION.Trim()) { throw 'Product version mismatch' }
          if ($file.VersionInfo.CompanyName -ne 'Jelofen1962') { throw 'Creator metadata mismatch' }
          if ($file.Length -le 0) { throw 'Executable is empty' }
          Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: RWV-windows-x64-${{ github.run_id }}
          path: ${{ runner.temp }}/webview-output/*.exe
          if-no-files-found: error
          retention-days: 30
