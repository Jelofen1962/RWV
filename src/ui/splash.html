<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; base-uri 'none'; form-action 'none'">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <title>__APP_NAME__</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #fff; color: #151515; }
    body { font-family: Poppins, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
    main { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 32px 24px 88px; }
    .brand { width: min(100%, 560px); text-align: center; animation: enter .38s ease-out both; }
    .icon { display: block; width: 96px; height: 96px; object-fit: contain; margin: 0 auto 24px; }
    h1 { font-size: clamp(20px, 4vw, 32px); font-weight: 600; letter-spacing: -.045em; line-height: 1.35; overflow-wrap: anywhere; margin: 0; }
    .loading { margin: 28px auto 0; width: 44px; height: 3px; border-radius: 99px; background: #ededed; overflow: hidden; }
    .loading::after { content: ''; display: block; width: 50%; height: 100%; border-radius: inherit; background: #242424; animation: slide 1.1s ease-in-out infinite alternate; }
    footer { position: fixed; bottom: 30px; inset-inline: 12px; text-align: center; color: #737373; font-size: 11px; font-weight: 400; }
    footer strong { color: #252525; font-weight: 600; }
    @keyframes slide { from { transform: translateX(-40%); } to { transform: translateX(140%); } }
    @keyframes enter { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .brand, .loading::after { animation: none; } }
    @media (max-height: 350px) { main { padding: 12px 16px 48px; } .icon { width: 60px; height: 60px; margin-bottom: 12px; } .loading { margin-top: 14px; } footer { bottom: 12px; } }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <img class="icon" src="data:image/png;base64,__APP_ICON__" alt="" width="96" height="96">
      <h1>__APP_NAME__</h1>
      <div class="loading" role="status" aria-label="Opening app"></div>
    </div>
  </main>
  <footer>powered by <strong>Jelofen1962</strong></footer>
</body>
</html>
