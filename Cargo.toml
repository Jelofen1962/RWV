[package]
name = "rwv"
authors = ["Jelofen1962"]
description = "Rustmade-WebView: turn a URL into a native desktop app"
repository = "https://github.com/Jelofen1962/RWV"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
base64 = "0.22"
tao = { version = "0.30", features = ["rwh_06"] }
wry = { version = "0.47", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[build-dependencies]
image = { version = "0.24.9", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
winres = "0.1.12"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
